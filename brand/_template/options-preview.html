<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Option Preview</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background: #f4f4f1; color: #20231f; }
    body { margin: 0; }
    main { max-width: 72rem; margin: auto; padding: 2rem; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: start; border-bottom: 1px solid #c9ccc5; padding-bottom: 1rem; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; margin-top: 2rem; }
    article { background: #fff; border: 1px solid #c9ccc5; padding: 1rem; }
    .swatch { height: 8rem; background: #1f6f68; margin: -1rem -1rem 1rem; }
    button { border: 1px solid currentColor; background: transparent; padding: .5rem .75rem; cursor: pointer; }
    [data-theme="dark"] { color-scheme: dark; background: #1c211f; color: #edf0ea; }
    [data-theme="dark"] article { background: #27302c; border-color: #56605a; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p>Brand OS Kit</p><h1>Option Preview</h1><p>Replace this shell with the approved subsystem options and interaction states.</p></div>
      <button type="button" id="theme-toggle">Toggle theme</button>
    </header>
    <section class="options" aria-label="Options">
      <article><div class="swatch"></div><h2>Option 1</h2><p>Concept, cohesion rationale, pros, and cons.</p></article>
      <article><div class="swatch" style="background:#d9853f"></div><h2>Option 2</h2><p>Concept, cohesion rationale, pros, and cons.</p></article>
    </section>
  </main>
  <script>
    document.querySelector('#theme-toggle').addEventListener('click', () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  </script>
</body>
</html>
