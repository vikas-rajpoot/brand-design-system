name: Verify Agent Configuration Sync

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Sync Script
        run: python3 scripts/sync-all.py
        
      - name: Check for Uncommitted Changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Agent configurations are out of sync! Please run 'python3 scripts/sync-all.py' and commit the changes."
            git diff
            exit 1
          else
            echo "All agent configurations (.github, .claude, .codex) are perfectly in sync."
          fi
