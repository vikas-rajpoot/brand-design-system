name: Brand OS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Skill mirrors are in sync
        run: .agents/sync.sh --check

      - name: Skill frontmatter
        run: .agents/scripts/lint-skills.sh

      - name: Brand files, project rules, and links
        run: node .agents/scripts/brand-check.mjs

      - name: Option files are append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BRAND_ALLOW_OPTIONS_REWRITE: ${{ contains(github.event.head_commit.message, '[allow-options-rewrite]') && '1' || '' }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare with; skipping."
            exit 0
          fi
          node .agents/scripts/brand-check.mjs --range "$BASE" HEAD
